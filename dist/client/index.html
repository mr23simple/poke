<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon GO</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon-Xu5iY9dm.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32-C8agoN7r.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16-CixKQmaw.png">
    <link rel="manifest" href="/assets/site-CRCgC9Nw.webmanifest">
    <link rel="shortcut icon" href="/assets/favicon-BR64d0U5.ico">
  <script type="module" crossorigin src="/assets/main-B3I6Ts_l.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/loadHeader-Fu3Vitex.js">
  <link rel="stylesheet" crossorigin href="/assets/loadHeader-ChzhX73W.css">
  <link rel="stylesheet" crossorigin href="/assets/style-public-DUCTZSvC.css">
</head>
<body class="dashboard-public">
    <div id="header-placeholder"></div>

    

    <div class="container" id="rankings-container">
        <div id="loading-overlay" class="loading-overlay">
            <div class="loading-spinner"></div>
            <p class="loading-message">Loading rankings...</p>
        </div>

        <!-- This is where the 3 columns will be rendered -->
        <div id="rankings-grid" class="hidden">
            
            <div class="ranking-column composite-column">
                <div class="card events-card">
                    <h2 class="events-card-header">
                        <span>Current & Upcoming Events</span>
                        <button id="expand-events-btn" class="btn btn-xs md:btn-sm btn-ghost btn-square text-base" aria-label="Expand events timeline" aria-expanded="false">↗</button>
                    </h2>
                    <div id="events-container" class="events-list">
                        <div class="loading-spinner-small"></div>
                    </div>
                </div>

                <div class="card activity-card">
                    <h2>Recent Player Activity</h2>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Current Buddy</th>
                                    <th class="hide-on-mobile">Distance</th>
                                    <th class="hide-on-mobile">Caught</th>
                                </tr>
                            </thead>
                            <tbody id="recent-players-body"></tbody>
                        </table>
                    </div>
                    <div class="ranking-footer flex gap-2 justify-center mt-3">
                        <button class="show-more-btn btn btn-sm btn-outline btn-neutral">Show All</button>
                        <button class="show-less-btn btn btn-sm btn-outline btn-neutral">Show Less</button>
                    </div>
                </div>
            </div>

            <div class="card ranking-column">
                <h2>Top 50 Strongest Pokémon</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Pokémon</th>
                                <th>CP</th>
                                <th class="hide-on-mobile">Owner</th>
                            </tr>
                        </thead>
                        <tbody id="strongest-pokemon-body"></tbody>
                    </table>
                </div>
                <div class="ranking-footer flex gap-2 justify-center mt-3">
                    <button class="show-more-btn btn btn-sm btn-outline btn-neutral">Show All</button>
                    <button class="show-less-btn btn btn-sm btn-outline btn-neutral">Show Less</button>
                </div>
            </div>

            <!-- THIS SECTION IS UPDATED TO USE A TABLE -->
            <div class="card ranking-column">
                <h2 class="ranking-title-with-info">
                    <span>Rarest Pokémon Showcase</span>
                    <button class="info-btn btn btn-xs btn-circle btn-ghost border border-base-300" aria-label="Show rarity calculation info">?</button>
                </h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Pokémon</th>
                                <th>Attributes</th>
                                <th class="hide-on-mobile">Owner</th>
                            </tr>
                        </thead>
                        <tbody id="rarest-pokemon-body"></tbody>
                    </table>
                </div>
                <div class="ranking-footer flex gap-2 justify-center mt-3">
                    <button class="show-more-btn btn btn-sm btn-outline btn-neutral">Show All</button>
                    <button class="show-less-btn btn btn-sm btn-outline btn-neutral">Show Less</button>
                </div>
            </div>
            
        </div>
    </div>
    
    <!-- Modal for detailed view -->
    <dialog id="modal-backdrop" class="modal">
        <div id="modal-content" class="modal-box max-w-4xl p-0 overflow-hidden relative">
            <!-- Modal content will be dynamically generated by JS -->
        </div>
        <form method="dialog" class="modal-backdrop">
            <button>close</button>
        </form>
    </dialog>

    <!-- Full-screen Event Timeline Modal -->
    <dialog id="timeline-modal-backdrop" class="modal">
        <div id="timeline-modal-content" class="modal-box w-11/12 max-w-7xl h-[85vh] p-6 flex flex-col overflow-hidden relative">
            <form method="dialog">
                <button id="timeline-modal-close-btn" class="btn btn-sm btn-circle btn-ghost absolute right-4 top-4">✕</button>
            </form>
            <h2 class="timeline-modal-title text-xl font-bold border-b border-base-300 pb-3">Current & Upcoming Events</h2>
            <div id="timeline-scroll-container" class="timeline-scroll-container flex-grow overflow-auto mt-4 border border-base-300 rounded-xl bg-base-100">
                <!-- Horizontal timeline grid will be populated here -->
            </div>
        </div>
        <form method="dialog" class="modal-backdrop">
            <button>close</button>
        </form>
    </dialog>

</body>
</html>
